name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: LLVM and Ninja
        run: |
          choco install llvm ninja -y --no-progress
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ui/panorama/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\openchanger
          key: protobuf-${{ hashFiles('cmake/protobuf/**', 'cmake/flags.cmake', 'thirdparty/protobuf/CMakeLists.txt') }}

      - name: Build
        shell: cmd
        run: tools\build.cmd release

      - uses: actions/upload-artifact@v4
        with:
          name: openchanger
          path: build/release/openchanger.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/release/openchanger.dll --title "${{ github.ref_name }}" --generate-notes
